plugins {
    id 'java'
}

group = 'com.mineskin'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

repositories {
    // MineUI（先在本仓库执行 ../mineUI/gradlew :mineui-paper:publishToMavenLocal）
    mavenLocal()
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'skinsrestorer'
        url = 'https://repo.codemc.io/repository/maven-public/'
    }
}

dependencies {
    // 运行时由服务器提供
    compileOnly "io.papermc.paper:paper-api:${paper_version}"
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'net.skinsrestorer:skinsrestorer-api:15.12.5'
    // MineUI 业务 API（可选集成：未安装时退化为聊天列表）
    compileOnly "com.mineui:mineui-paper:${mineui_version}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveBaseName = 'MineSkin'
}
